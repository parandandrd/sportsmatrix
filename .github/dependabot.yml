# Dependabot version updates, weekly, one grouped PR per ecosystem for minor and
# patch releases. A major release is left out of the group on purpose: it opens
# its own PR so it gets a look of its own (react-router 8, jest-dom 7).
#
# Dependabot opens PRs, which is the only thing that runs CI here; it is a
# GitHub service, not a scheduled workflow. Security updates ignore this
# schedule. Reference:
# https://docs.github.com/en/code-security/dependabot/dependabot-version-updates/configuration-options-for-the-dependabot.yml-file
#
# What it cannot see, because no manifest names it: the Go toolchain and
# golangci-lint pins in script/common and Dockerfile.pibuilder, .nvmrc, and the
# vendored matrix library. script/check-updates reports those.
version: 2
updates:
  # vendor/ is committed; Dependabot runs `go mod vendor` for these PRs.
  - package-ecosystem: "gomod"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
    groups:
      go-minor-patch:
        applies-to: "version-updates"
        patterns:
          - "*"
        update-types:
          - "minor"
          - "patch"

  - package-ecosystem: "npm"
    directory: "/web"
    schedule:
      interval: "weekly"
      day: "monday"
    groups:
      npm-minor-patch:
        applies-to: "version-updates"
        patterns:
          - "*"
        update-types:
          - "minor"
          - "patch"

  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
    groups:
      actions:
        applies-to: "version-updates"
        patterns:
          - "*"

  # The base image of the aarch64 cross-build, in Dockerfile.pibuilder.
  - package-ecosystem: "docker"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
