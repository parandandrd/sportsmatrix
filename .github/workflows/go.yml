name: Go

on:
  pull_request:
    paths:
    - 'cmd/**'
    - 'internal/**'
    - 'vendor/**'
    - go.mod
    - go.sum
    - 'web/**'
    - 'proto/**'
    - 'pkg/**'
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4

    - name: Set up QEMU
      id: qemu
      uses: docker/setup-qemu-action@v3
      with:
        image: tonistiigi/binfmt:latest
        platforms: all

    - name: Lint
      run: ./script/lint

    - name: Test
      run: ./script/test

    - uses: actions/setup-node@v4
      with:
        node-version-file: '.nvmrc'
        cache: 'npm'
        cache-dependency-path: "web/package-lock.json"

    # swagger-ui-react 5.20 declares a peer range of react >=16.8.0 <19 while
    # the project is on react 19, so npm's strict peer check rejects a lockfile
    # that installs and builds perfectly well. Skip the check rather than pin
    # react back.
    - run: npm ci --legacy-peer-deps
      working-directory: "./web"

    # CI=true makes react-scripts run once and exit instead of watching
    - run: CI=true npm test
      working-directory: "./web"

    - run: npm run build
      working-directory: "./web"

    - name: Build
      run: ./script/build
