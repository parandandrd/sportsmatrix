name: Go

on:
  pull_request:
    paths:
    - 'cmd/**'
    - 'internal/**'
    - 'vendor/**'
    - go.mod
    - go.sum
    - 'web/**'
    - 'proto/**'
    - 'pkg/**'
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4

    # Lint, test and the amd64 build all run directly on the runner now. They
    # used to run inside images pulled from a Docker Hub namespace this repo
    # cannot publish to, which meant editing a Dockerfile broke CI with no way
    # to build a replacement.
    - uses: actions/setup-go@v5
      with:
        go-version-file: go.mod
        cache-dependency-path: go.sum

    - name: Install golangci-lint
      run: |
        source script/common
        curl -sSfL https://raw.githubusercontent.com/golangci/golangci-lint/master/install.sh \
          | sh -s -- -b "$(go env GOPATH)/bin" "v${GOLANGCI_VERSION}"
        echo "$(go env GOPATH)/bin" >> "$GITHUB_PATH"

    - name: Lint
      run: ./script/lint

    - name: Test
      run: ./script/test

    - uses: actions/setup-node@v4
      with:
        node-version-file: '.nvmrc'
        cache: 'npm'
        cache-dependency-path: "web/package-lock.json"

    # swagger-ui-react 5.20 declares a peer range of react >=16.8.0 <19 while
    # the project is on react 19, so npm's strict peer check rejects a lockfile
    # that installs and builds perfectly well. Skip the check rather than pin
    # react back.
    - run: npm ci --legacy-peer-deps
      working-directory: "./web"

    # CI=true makes react-scripts run once and exit instead of watching
    - run: CI=true npm test
      working-directory: "./web"

    - run: npm run build
      working-directory: "./web"

    - name: Build
      run: ./script/build
