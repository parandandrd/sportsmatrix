name: Release
on:
  push:
    tags:
    - 'v*'
  workflow_dispatch:
    inputs:
      version:
        description: "Release version, including the leading v (e.g. v0.0.1-beta.1)"
        required: true
        type: string

# On a tag push the version is the tag. On a manual run there is no tag yet, so
# it comes from the input and the release step creates the tag at the commit
# that was built.
env:
  VERSION: ${{ inputs.version || github.ref_name }}

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4
    - name: Set up QEMU
      id: qemu
      uses: docker/setup-qemu-action@v3
      with:
        image: tonistiigi/binfmt:latest
        platforms: all

    - name: Lint
      run: ./script/lint

    - name: Test
      run: ./script/test

    - uses: actions/setup-node@v4
      with:
        node-version-file: '.nvmrc'
        cache: 'npm'
        cache-dependency-path: "web/package-lock.json"

    - run: npm ci
      working-directory: "./web"

    - run: npm run build
      working-directory: "./web"

    - name: Build
      run: ./script/release-all

    - uses: ncipollo/release-action@v1
      with:
        artifacts: "*.deb"
        generateReleaseNotes: true
        tag: ${{ inputs.version || github.ref_name }}
        commit: ${{ github.sha }}
        prerelease: ${{ contains(inputs.version || github.ref_name, 'beta') }}
