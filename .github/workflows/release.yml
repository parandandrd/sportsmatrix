name: Release
on:
  push:
    tags:
    - 'v*'
  workflow_dispatch:
    inputs:
      version:
        description: "Release version, including the leading v (e.g. v0.0.1-beta.1)"
        required: true
        type: string

# On a tag push the version is the tag. On a manual run there is no tag yet, so
# it comes from the input and the release step creates the tag at the commit
# that was built.
env:
  VERSION: ${{ inputs.version || github.ref_name }}

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4

    # Still needed here, unlike the Go workflow: release-all cross-builds the
    # aarch64 binary in a foreign-architecture container.
    - name: Set up QEMU
      id: qemu
      uses: docker/setup-qemu-action@v3
      with:
        image: tonistiigi/binfmt:latest
        platforms: all

    # script/lint and script/test run directly on the runner now, so they need
    # the toolchain the builder image used to supply.
    - uses: actions/setup-go@v5
      with:
        go-version-file: go.mod
        cache-dependency-path: go.sum

    - name: Install golangci-lint
      run: |
        source script/common
        curl -sSfL https://raw.githubusercontent.com/golangci/golangci-lint/master/install.sh \
          | sh -s -- -b "$(go env GOPATH)/bin" "v${GOLANGCI_VERSION}"
        echo "$(go env GOPATH)/bin" >> "$GITHUB_PATH"

    - name: Lint
      run: ./script/lint

    - name: Test
      run: ./script/test

    - uses: actions/setup-node@v4
      with:
        node-version-file: '.nvmrc'
        cache: 'npm'
        cache-dependency-path: "web/package-lock.json"

    # swagger-ui-react 5.20 declares a peer range of react >=16.8.0 <19 while
    # the project is on react 19, so npm's strict peer check rejects a lockfile
    # that installs and builds perfectly well. Skip the check rather than pin
    # react back.
    - run: npm ci --legacy-peer-deps
      working-directory: "./web"

    - run: npm run build
      working-directory: "./web"

    - name: Build
      run: ./script/release-all

    - uses: ncipollo/release-action@v1
      with:
        artifacts: "*.deb"
        generateReleaseNotes: true
        tag: ${{ inputs.version || github.ref_name }}
        commit: ${{ github.sha }}
        prerelease: ${{ contains(inputs.version || github.ref_name, 'beta') }}
