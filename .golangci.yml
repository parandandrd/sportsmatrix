version: "2"
run:
  modules-download-mode: vendor
  tests: true
linters:
  default: none
  enable:
    - asciicheck
    - bodyclose
    - copyloopvar
    - durationcheck
    - errcheck
    - errorlint
    - govet
    - importas
    - ineffassign
    - misspell
    - nakedret
    - nilerr
    - noctx
    - nonamedreturns
    - nosprintfhostport
    - paralleltest
    - predeclared
    - promlinter
    - revive
    - sqlclosecheck
    - staticcheck
    - tparallel
    - unconvert
    - unparam
    - unused
    - whitespace
  settings:
    staticcheck:
      # v1 ran staticcheck (SA) and gosimple (S) but not stylecheck (ST); v2
      # merged all three, plus quickfix (QF), into staticcheck.
      checks:
        - all
        - -ST*
        - -QF*
    govet:
      disable:
        - fieldalignment
      enable-all: true
    revive:
      rules:
        - name: exported
          disabled: true
  exclusions:
    generated: lax
    rules:
      - path: (.+)\.go$
        text: Error return value of .((os\.)?std(out|err)\..*|.*Close|.*Flush|os\.Remove(All)?|.*printf?|os\.(Un)?Setenv). is not checked
      - path: (.+)\.go$
        text: 'shadow: declaration of "err" shadows declaration at line (\d+)'
    paths:
      - vendor
      - internal/rgbmatrix-rpi
      - internal/proto
      - third_party$
      - builtin$
      - examples$
formatters:
  enable:
    - gofumpt
    - goimports
  settings:
    goimports:
      local-prefixes:
        - github.com/parandandrd/sportsmatrix
  exclusions:
    generated: lax
    paths:
      - vendor
      - internal/rgbmatrix-rpi
      - internal/proto
      - third_party$
      - builtin$
      - examples$
