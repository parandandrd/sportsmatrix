syntax = "proto3";
package matrix.v1;
option go_package = "github.com/parandandrd/sportsmatrix/internal/proto/sportsmatrix";
import "google/protobuf/empty.proto";

service Sportsmatrix {
       rpc Version(google.protobuf.Empty) returns (VersionResp);
       rpc ScreenOn(google.protobuf.Empty) returns (google.protobuf.Empty);
       rpc ScreenOff(google.protobuf.Empty) returns (google.protobuf.Empty);
       rpc GetStatus(google.protobuf.Empty) returns (Status);
       rpc SetStatus(Status) returns (google.protobuf.Empty);
       rpc SetAll(SetAllReq) returns (google.protobuf.Empty);
       rpc Jump(JumpReq) returns (google.protobuf.Empty);
       rpc NextBoard(google.protobuf.Empty) returns (google.protobuf.Empty);
       rpc RestartService(google.protobuf.Empty) returns (google.protobuf.Empty);
       rpc SetLiveOnly(LiveOnlyReq) returns (google.protobuf.Empty);
       rpc ListBoards(google.protobuf.Empty) returns (ListBoardsResp);
       rpc SetBoardEnabled(SetBoardEnabledReq) returns (google.protobuf.Empty);
       rpc SetBoardOrder(SetBoardOrderReq) returns (google.protobuf.Empty);
       rpc GetSettings(google.protobuf.Empty) returns (Settings);
       rpc SetBrightness(SetBrightnessReq) returns (google.protobuf.Empty);
       rpc SetScreenSchedule(ScreenSchedule) returns (google.protobuf.Empty);
       rpc GetBoardSettings(BoardSettingsReq) returns (BoardSettings);
       rpc SetBoardSettings(BoardSettings) returns (google.protobuf.Empty);
}

message VersionResp {
    string version = 1;
}

message Status {
    bool screen_on = 1;
    bool webboard_on = 2;
    bool combined_scroll = 3;
}

message SetAllReq {
    bool enabled = 1;
}

message JumpReq {
    string board = 1;
}

message LiveOnlyReq {
    bool live_only = 1;
}

// BoardInfo describes one board this instance runs. Every board the binary can
// render is built, on defaults for any section the config file leaves out, so
// in_config_file is what says whether a board was actually configured.
message BoardInfo {
    // name as the board reports it, which is what Jump expects
    string name = 1;
    // enabled is the board's current state, which the API can change at runtime
    bool enabled = 2;
    // in_between marks boards that render between the others rather than
    // taking their own turn in the rotation
    bool in_between = 3;
    // rpc_path is where this board mounts its own service, trailing slash
    // included, e.g. "/nhl/sport.v1.Sport/". The service name in it says what
    // kind of board this is, so a client can drive a board's own settings
    // without a hardcoded table of leagues. Empty for a board with no service.
    string rpc_path = 4;
    // section is the top-level config file key this board is built from, e.g.
    // "nhlConfig". A league's stats and headlines boards share its section.
    string section = 5;
    // in_config_file is false when section is missing from the config file and
    // the board is running on defaults.
    bool in_config_file = 6;
}

message ListBoardsResp {
    // boards are in the order their sections appear in the config file, with
    // boards whose section it leaves out last. That is not necessarily the
    // order the panel shows them in.
    repeated BoardInfo boards = 1;
}

// SetBoardEnabledReq turns a single board on or off by name. SetAll is all or
// nothing, and every other way to toggle one board runs through that board's
// own service, which means knowing its kind and RPC path first.
message SetBoardEnabledReq {
    // name as ListBoards reports it. Matched case-insensitively, like Jump.
    string name = 1;
    bool enabled = 2;
}

// SetBoardOrderReq puts boards in a new order by the config sections they come
// from. The panel cycles through boards in that order, and the config file's
// sections are rearranged to match, so the order outlasts a restart.
message SetBoardOrderReq {
    // sections as ListBoards reports them, in the order wanted. The sections
    // named trade the places they had; any left out stay where they are.
    repeated string sections = 1;
}

// Settings are the matrix-wide settings that can be changed while it runs.
message Settings {
    // brightness of the panel, from 1 to 100
    int32 brightness = 1;
    ScreenSchedule screen_schedule = 2;
    // config_file is where changes are saved. Empty when the matrix was
    // started without one, and changes last until it restarts.
    string config_file = 3;
}

message SetBrightnessReq {
    // from 1 to 100, taking effect at once
    int32 brightness = 1;
}

// ScreenSchedule is when the screen turns itself on and off, as cron
// expressions: "30 7 * * *" is half past seven every day.
message ScreenSchedule {
    repeated string on_times = 1;
    repeated string off_times = 2;
}

message BoardSettingsReq {
    // name as ListBoards reports it
    string name = 1;
}

// BoardSettings are the settings of one board that can be changed while it
// runs. A board has only some of them, and the has_ fields say which. Setting
// them saves them to the config file.
message BoardSettings {
    // name as ListBoards reports it
    string name = 1;

    bool has_board_delay = 2;
    // how long the board shows for, as a duration such as "15s" or "1m30s". A
    // sport board shows each game for this long. Left empty, it is unchanged.
    string board_delay = 3;
    // the least board_delay can be. Only in answers.
    string min_board_delay = 4;

    // set has_teams to change watch_teams and favorite_teams
    bool has_teams = 5;
    // the teams whose games are shown: abbreviations, or ALL, a conference or a
    // ranking such as TOP25. None is the same as ALL.
    repeated string watch_teams = 6;
    // the teams whose scores can be hidden, and whose live games can be stuck to
    repeated string favorite_teams = 7;
    // the league's teams, to choose from. Only in answers.
    repeated Team teams = 8;
}

message Team {
    string abbreviation = 1;
    string name = 2;
}
