syntax = "proto3";
package matrix.v1;
option go_package = "github.com/parandandrd/sportsmatrix/internal/proto/sportsmatrix";
import "google/protobuf/empty.proto";

service Sportsmatrix {
       rpc Version(google.protobuf.Empty) returns (VersionResp);
       rpc ScreenOn(google.protobuf.Empty) returns (google.protobuf.Empty);
       rpc ScreenOff(google.protobuf.Empty) returns (google.protobuf.Empty);
       rpc GetStatus(google.protobuf.Empty) returns (Status);
       rpc SetStatus(Status) returns (google.protobuf.Empty);
       rpc SetAll(SetAllReq) returns (google.protobuf.Empty);
       rpc Jump(JumpReq) returns (google.protobuf.Empty);
       rpc NextBoard(google.protobuf.Empty) returns (google.protobuf.Empty);
       rpc RestartService(google.protobuf.Empty) returns (google.protobuf.Empty);
       rpc SetLiveOnly(LiveOnlyReq) returns (google.protobuf.Empty);
       rpc ListBoards(google.protobuf.Empty) returns (ListBoardsResp);
       rpc SetBoardEnabled(SetBoardEnabledReq) returns (google.protobuf.Empty);
}

message VersionResp {
    string version = 1;
}

message Status {
    bool screen_on = 1;
    bool webboard_on = 2;
    bool combined_scroll = 3;
}

message SetAllReq {
    bool enabled = 1;
}

message JumpReq {
    string board = 1;
}

message LiveOnlyReq {
    bool live_only = 1;
}

// Board describes a board that this instance was configured with. Boards are
// only constructed when their config section is present, so this is the set
// that actually exists, not everything the binary knows how to render.
message BoardInfo {
    // name as the board reports it, which is what Jump expects
    string name = 1;
    // enabled is the board's current state, which the API can change at runtime
    bool enabled = 2;
    // in_between marks boards that render between the others rather than
    // taking their own turn in the rotation
    bool in_between = 3;
    // rpc_path is where this board mounts its own service, trailing slash
    // included, e.g. "/nhl/sport.v1.Sport/". The service name in it says what
    // kind of board this is, so a client can drive a board's own settings
    // without a hardcoded table of leagues. Empty for a board with no service.
    string rpc_path = 4;
}

message ListBoardsResp {
    repeated BoardInfo boards = 1;
}

// SetBoardEnabledReq turns a single board on or off by name. SetAll is all or
// nothing, and every other way to toggle one board runs through that board's
// own service, which means knowing its kind and RPC path first.
message SetBoardEnabledReq {
    // name as ListBoards reports it. Matched case-insensitively, like Jump.
    string name = 1;
    bool enabled = 2;
}
